name: Release AdocForge packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to npm after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack:packages
      - run: pnpm verify:consumer
      - run: pnpm verify:publish
      - run: pnpm changeset status
      - run: pnpm publish:packages

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish:packages -- --publish
        env:
          ADOCFORGE_PUBLISH_APPROVED: 'yes'
          NPM_PUBLISH_REGISTRY: https://registry.npmjs.org/
